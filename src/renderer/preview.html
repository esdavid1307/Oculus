<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Oculus Agent UI preview</title>
    <link rel="stylesheet" href="./overlay.css" />
    <style>
      html,
      body {
        background:
          radial-gradient(50% 40% at 50% 0%, rgb(40 50 80 / 50%), transparent 70%),
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect fill="%231118" width="8" height="8"/></svg>'),
          #1d1d22;
      }
    </style>
    <script>
      window.overlay = {
        onState(listener) {
          window.__push = listener;
        },
        onLargeView(listener) {
          listener({ enabled: true, uiScale: 1.15, dockIconSize: 96 });
        },
        onIntentLooks() {},
        sendGaze() {},
      };
    </script>
    <script type="module" src="./overlay.ts"></script>
    <script type="module">
      const scene = new URLSearchParams(location.search).get('scene') ?? 'idle';
      const idle = { phase: 'idle', wakeProgress: 0 };
      const scenes = {
        idle,
        waking: { phase: 'idle', wakeProgress: 0.72 },
        waiting: { phase: 'waiting-for-target', wakeProgress: 1 },
        thinking: { phase: 'thinking', wakeProgress: 1 },
        typing: {
          phase: 'typing',
          wakeProgress: 1,
          text: 'I would like some',
          group: null,
          highlight: 'word:water',
          suggestions: ['water', 'help', 'rest'],
          phrases: ['I would like some water please'],
          stepMs: 2000,
        },
        choosing: {
          phase: 'choosing',
          wakeProgress: 1,
          intents: ['Open this video', 'Skip the ad', 'Scroll for more', 'Turn on captions'],
          highlight: 'intent-0',
          cells: 6,
          recent: 2,
          fixed: ['type'],
          side: 'right',
          stepProgress: 0.4,
        },
        finished: { phase: 'finished', wakeProgress: 1, intent: 'Open this video', ok: true, summary: 'Opened the video you were looking at.' },
        stop: { phase: 'waiting-for-target', wakeProgress: 1, stopInMs: 3200 },
      };
      const wait = () =>
        new Promise((resolve) => {
          const tick = () => (window.__push ? resolve() : requestAnimationFrame(tick));
          tick();
        });
      await wait();
      if (scene === 'choosing') {
        window.__push({ phase: 'choosing', wakeProgress: 1, intents: ['Open this video', 'Skip the ad'], highlight: 'intent-0', cells: 6, recent: 2, fixed: ['type'], side: 'right', stepProgress: 0 });
        window.__push(scenes.choosing);
      } else {
        window.__push(scenes[scene] ?? idle);
      }
    </script>
  </head>
  <body>
    <svg class="svg-filters" aria-hidden="true">
      <filter id="noise" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" />
      </filter>
    </svg>
    <div id="glow"><div></div></div>
    <div id="keyboard">
      <div class="aurora" aria-hidden="true"></div>
      <div class="noise" aria-hidden="true"></div>
      <div id="typed"></div>
      <div id="no-intents" hidden>Nothing this time. Blink on More to try again.</div>
    </div>
    <div id="wake" class="target">
      <div class="wake-aurora" aria-hidden="true"></div>
      <div class="wake-specular" aria-hidden="true"></div>
      <div class="ring"></div>
      <div class="wake-label">
        <strong>Look here to start</strong>
        <span class="rest">Keep looking to begin</span>
        <span class="holding">Keep looking…</span>
        <em class="wake-brand">Oculus Agent</em>
      </div>
    </div>
    <div id="face-ring"></div>
    <p id="gaze-message" hidden></p>
    <div id="icon-highlight"></div>
    <div id="icon-magnifier" hidden></div>
    <div id="status" hidden>
      <span class="glyph"></span>
      <span class="lines"><strong></strong><span class="detail"></span><small></small></span>
    </div>
    <p id="stop-hint" hidden></p>
    <div id="dot" hidden></div>
  </body>
</html>
